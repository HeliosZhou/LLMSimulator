model:
  model_name: deepseekV3
system:
  gpu_gen: B200
  nvlink_gen: 5
  infiniband_gen: 7200
  num_node: 4
  num_device: 8
  processor_type: GPU
  distribution:
    expert_tensor_degree: 1
    none_expert_tensor_degree: 1
  optimization:
    parallel_execution: false
    hetero_subbatch: false
    disagg_system: false
    use_low_unit_moe_only: false
    use_ramulator: false
    compressed_kv: true
    use_absorb: true
    use_flash_mla: true
    use_flash_attention: true
    reuse_kv_cache: true
    kv_cache_reuse_rate: 0.0
    prefill_mode: false
    decode_mode: true
serving:
  max_batch_size: 64
  max_process_token: 0
simulation:
  data: synthesis
  input_len: 2048
  output_len: 2
  precision_byte: 2
  skewness: 0.0
  iter: 3
  injection_rate: 0
  exit_out_of_memory: false
  mem_cap_limit: false
log:
  print_log: false
  export_gantt: false
  output_directory: /home/zsy/LLMSimulator/experiments/exp4/data
  gantt_directory: ./gantt
